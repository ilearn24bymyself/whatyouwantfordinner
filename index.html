<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晚餐拉霸機</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>今晚吃什麼？</h1>
      <p class="sub">不用想，按下去就好</p>
    </header>

    <div class="modes">
      <button id="drawAll" class="clay clay-pink clay-btn primary" type="button">🎲 直接給答案</button>
      <button id="drawStep" class="clay clay-btn primary step" type="button">👣 一步一步來</button>
    </div>

    <fieldset id="districtBox" class="districts" hidden>
      <legend>行政區（不選＝不限）</legend>
      <div id="districtChips" class="chips"></div>
    </fieldset>

    <label id="nearbyLabel" class="clay nearby"><input type="checkbox" id="nearby" checked autocomplete="off" aria-label="只抽附近的店" aria-describedby="nearbyNote"> 只抽附近的店<span id="nearbyNote" class="note"></span></label>
    <label class="clay nearby"><input type="checkbox" id="chains" checked autocomplete="off"> 包含連鎖店與便利商店</label>
    <p id="locationHint" class="hint" role="status"></p>
    <p id="emptyMessage" class="clay notice" role="status" hidden>沒有符合條件的店。可以試試勾選「包含連鎖店與便利商店」，或關掉「只抽附近的店」。</p>

    <section id="result" class="result" hidden aria-live="polite">
      <div class="clay layer" id="mealLayer">
        <span class="label">吃什麼</span>
        <span class="value" id="meal"></span>
        <button class="clay-btn reroll" type="button" data-reroll="meal" aria-label="換吃什麼">換</button>
      </div>
      <div class="clay layer" id="placeLayer">
        <span class="label">去哪吃</span>
        <span class="value" id="place"></span>
        <button class="clay-btn reroll" type="button" data-reroll="place" aria-label="換去哪吃">換</button>
      </div>
      <div class="clay layer" id="itemsLayer">
        <span class="label">點什麼</span>
        <ul class="items" id="items"></ul>
        <button class="clay-btn reroll" type="button" data-reroll="items" aria-label="換點什麼">換</button>
      </div>

      <div class="clay summary" id="summary">
        <div class="kcal"><span id="total"></span> 卡 <small>／目標 <span id="target"></span>・差距 <span id="diff"></span></small></div>
        <p class="verdict" id="verdict"></p>
      </div>

      <button id="next" class="clay clay-btn next" type="button">揭曉下一層 👇</button>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
